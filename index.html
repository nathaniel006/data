<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search UI</title>

<style>
  html, body {
  scrollbar-width: none;  /* Firefox */
}

body::-webkit-scrollbar,
html::-webkit-scrollbar {
  display: none; /* Chrome, Edge, Safari */
}
body {
  margin: 0;
  padding: 0;
  background: #4a4a4a;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;

  /* KEY FIX */
  align-items: flex-start;

  min-height: 100vh;
  overflow-y: auto;
  padding-top: 60px;
}

  /* ------------------------------
     HAMBURGER ICON (Animated)
  ------------------------------ */
  .nav-icon {
    position: fixed;
    top: 16px;
    right: 20px;
    width: 32px;
    height: 26px;
    cursor: pointer;
    z-index: 1400;
    transition: 0.3s ease;
  }

  .nav-icon div {
    width: 100%;
    height: 4px;
    background: white;
    margin: 5px 0;
    border-radius: 4px;
    transition: 0.3s ease;
  }

  .nav-icon.open div:nth-child(1) {
    transform: translateY(9px) rotate(45deg);
  }
  .nav-icon.open div:nth-child(2) {
    opacity: 0;
  }
  .nav-icon.open div:nth-child(3) {
    transform: translateY(-9px) rotate(-45deg);
  }

  /* ------------------------------
     OVERLAY
  ------------------------------ */
  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(3px);
    z-index: 1200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .menu-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* ------------------------------
     SLIDING MENU
  ------------------------------ */
  .side-menu {
    position: fixed;
    top: 0;
    right: 0;
    width: 55%;
    height: 100%;
    background: #2d2d2d;
    border-left: 1px solid #555;
    box-shadow: -4px 0 18px rgba(0,0,0,0.4);
    z-index: 1300;
    padding: 24px;
    transform: translateX(100%);
    transition: transform 0.35s ease;
  }

  .side-menu.open {
    transform: translateX(0);
  }

  .menu-item {
    color: white;
    font-size: 20px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: 0.25s ease;
  }

  .menu-item:hover {
    padding-left: 10px;
    color: #dcdcdc;
  }

  /* ------------------------------
     MAIN UI
  ------------------------------ */
  .container {
    width: 90%;
    max-width: 600px;
    text-align: center;
  }

.search-box {
  width: 100%;
  display: flex;
  justify-content: center;
}
  /* Wrapper ensures clear button stays INSIDE the bar */
.search-wrapper {
  position: relative;
  width: 100%;
}

.search-input {
  width: 100%;
  padding: 14px;
  padding-right: 40px; /* space for clear button */
  border-radius: 10px;
  border: 1px solid #555;
  background: #2f2f2f;
  color: white;
  font-size: 18px;
  box-sizing: border-box;
  margin-bottom: 5px;
}

  .search-input::placeholder {
    color: #bfbfbf;
  }

  .search-input:focus {
    border-color: #888;
    background: #3a3a3a;
  }

/* CLEAR BUTTON (simple X, matches nav style theme) */
.clear-btn {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-60%);
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  cursor: pointer;

  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;
}

.clear-btn.show {
  opacity: 1;
  pointer-events: auto;
}

/* X shape */
.clear-btn span {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 18px;
  height: 3px;
  background: white;
  border-radius: 3px;
}

.clear-btn span:nth-child(1) {
  transform: translate(-50%, -50%) rotate(45deg);
}

.clear-btn span:nth-child(2) {
  transform: translate(-50%, -50%) rotate(-45deg);
}

  .results-box {
    background: #2f2f2f;
    padding: 20px;
    border-radius: 10px;
    min-height: 300px;
    max-height: 300px;
    overflow-y: auto;
    text-align: left;
    border: 1px solid #555;
    color: white;
    scrollbar-width: none;
  }

  .results-box::-webkit-scrollbar {
    display: none;
  }

  .result-item {
    padding: 14px;
    margin-bottom: 12px;
    background: #3a3a3a;
    border-left: 5px solid #666;
    border-radius: 6px;
    transition: 0.5s ease;
    border-top: 1px solid transparent;
    border-right: 1px solid transparent;
    border-bottom: 1px solid transparent;

    box-sizing: border-box;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .result-item:hover {
    background: #444;
    transform: translateX(6px);
  }

  .details {
    background: #1f1f1f;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    animation: slideDown 0.35s ease forwards;
    margin-bottom: 10px;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .details-panel {
  margin-top: 12px;
  background: #1f1f1f;
  border: 1px solid white;
  border-radius: 8px;
  padding: 12px;
  color: white;
  text-align: left;
  animation: slideDown 0.25s ease;
}

.hidden {
  display: none;
}

.details-panel strong {
  display: block;
  margin-bottom: 6px;
}
.result-item.selected {
  background: #454545;
  border-top: 1px solid white;
  border-bottom: 1px solid white;
  border-right: 1px solid white;
  border-left: 5px solid #3b82f6; /* blue */
}
.menu-item {
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
}
</style>
</head>

<body>

  <!-- HAMBURGER ICON -->
  <div class="nav-icon" id="navIcon" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- OVERLAY -->
  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

  <!-- SLIDING MENU -->
  <div class="side-menu" id="sideMenu">
    <div class="menu-item">Home</div>
    <div class="menu-item">Parts</div>
    <div class="menu-item">Troubleshooting</div>
    <div class="menu-item">Tools</div>
    <div class="menu-item">About</div>
  </div>

  <!-- MAIN UI -->
  <div class="container">
 <div class="search-box">
  <div class="search-wrapper">
    <input id="searchInput" class="search-input" type="text" placeholder="ex: leading edge panel...">
    <button id="clearBtn" class="clear-btn" aria-label="Clear search">
  <span></span>
  <span></span>
</button>
  </div>
</div>


<div id="results" class="results-box">
  <em>Searched items appear here...</em>
</div>

<div id="detailsPanel" class="details-panel hidden">
  <em>Select an item to view details</em>
</div>
  </div>

<script>
  function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("menuOverlay");
    const icon = document.getElementById("navIcon");

    let selectedItem = null;

    menu.classList.toggle("open");
    overlay.classList.toggle("open");
    icon.classList.toggle("open");
  }

  const data = [
    { name: "frequencies", info: "dispatch - 122.875 <br> atis - 119.750 <br> tower - 119.900" },
    { name: "leading edge panel", info: "screws - MS24694-S50 <br> [ alt: MS24694-S51 ]" },
    { name: "center section upper panel", info: "screws - MS24694-S50 <br> [ alt: MS24694-S51 ]" },
    { name: "center section lower panel", info: "screws - MS24694-S50 <br> [ alt: MS24694-S51 ]" },
    { name: "nacelle fender panel", info: "screws - AN525-10R7" },
    { name: "turtle shell aft panel", info: "screws - AN525-10R7 <br> screws - AN525-10R8" },
    { name: "turtle shell", info: "screws - MS24694-S50 <br> [ alt: MS24694-S51 ]" },
    { name: "spinner", info: "washer - A1020 <br> screws - MS51958-63" },
    { name: "leading edge fairing", info: "screws - AN525-83R8" },
    { name: "exhaust", info: "bolts - MS20034-1 <br> washers - AN960C416 <br> nuts - MS20500-428 <br> clamps - 20KS3" }
  ];

  const input = document.getElementById("searchInput");
  const resultsBox = document.getElementById("results");
  const clearBtn = document.getElementById("clearBtn");

  let openDetails = null;

  input.addEventListener("input", () => {
    const query = input.value.toLowerCase();

    if (query.length > 0) {
      clearBtn.classList.add("show");
    } else {
      clearBtn.classList.remove("show");
    }

    resultsBox.innerHTML = "";
    openDetails = null;

    if (query.trim() === "") {
      resultsBox.innerHTML = "<em>Searched items appear here...</em>";
      return;
    }

    const filtered = data.filter(item =>
      item.name.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
      resultsBox.innerHTML = "<em>No results found</em>";
      return;
    }

    filtered.forEach(item => {
      const wrapper = document.createElement("div");

      const div = document.createElement("div");
      div.className = "result-item";
      div.textContent = item.name;

div.addEventListener("click", () => {
  const panel = document.getElementById("detailsPanel");

  panel.classList.remove("hidden");

  panel.innerHTML = `
    <strong>${item.name}</strong><br>
    ${item.info}
  `;

  // remove previous selection (safer query approach)
  document.querySelectorAll(".result-item.selected")
    .forEach(el => el.classList.remove("selected"));

  // apply new selection
  div.classList.add("selected");
});
      wrapper.appendChild(div);
      resultsBox.appendChild(wrapper);
    });
  });

clearBtn.addEventListener("click", () => {
  input.value = "";
  clearBtn.classList.remove("show");

  resultsBox.innerHTML = "<em>Searched items appear here...</em>";

  const panel = document.getElementById("detailsPanel");
  panel.classList.add("hidden");
  panel.innerHTML = "<em>Select an item to view details</em>";

  input.focus();
  openDetails = null;
});
</script>

</body>
</html>
